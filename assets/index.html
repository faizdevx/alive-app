<style>

ol{padding-left:20px;margin:6px 0}li{margin:5px 0}

.jglow{animation:blink 1s steps(1) infinite}

.jstrip{position:absolute;right:4px;top:6px;bottom:6px;width:12px;z-index:2;background:#0a0c0a;border:2px solid var(--ink);box-shadow:0 0 0 1px var(--line)}
.jstrip i{position:absolute;left:0;right:0}.jstrip b{position:absolute;left:-4px;width:16px;height:6px;margin-top:-3px;background:var(--acc);border:2px solid var(--ink)}
.jpic{display:block;width:100%;max-height:200px;object-fit:cover;object-position:top;image-rendering:pixelated;border:2px solid var(--ink);box-shadow:0 0 0 2px var(--line);margin:0 0 12px}
.jth{width:64px;height:64px;object-fit:cover;object-position:top;border:2px solid var(--ink);flex:none;image-rendering:pixelated}.jth.sm{width:40px;height:40px}
details.jt{border-top:2px solid var(--panel2);padding:8px 0}details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
details.jt summary{display:flex;justify-content:space-between;align-items:center;gap:8px}details.jt[open] summary{color:var(--acc)}
.mb{font-family:Pix,monospace;font-size:11px;padding:1px 6px;border:2px solid currentColor;white-space:nowrap;flex:none}
.amap{height:62vh;overflow-y:auto;border:2px solid var(--ink);box-shadow:0 0 0 2px var(--line);background:#0b1020;scrollbar-width:none}.amap::-webkit-scrollbar{display:none}.amap svg{display:block;width:100%;height:auto;shape-rendering:crispEdges}
@keyframes atw{50%{opacity:.15}}.astar{animation:atw 2.4s steps(2) infinite}

.atask{align-items:flex-start;gap:10px;cursor:pointer}.atask.on>span:last-child{color:var(--mu)}.abox{flex:none;width:22px;height:22px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--acc);font-weight:700;margin-top:1px}.atask.on .abox{border-color:var(--acc);background:#16260f}

.pick button.sm{flex:1;padding:8px 2px;font-size:11px}
.ms0{color:var(--mu)}.ms1{color:#7fa7d9}.ms2{color:var(--gold)}.ms3{color:#e39a4d}.ms4{color:#c08ad9}.ms5{color:var(--acc)}.ms6{color:#2a2108;background:var(--gold);border-color:var(--gold)}
.jsc .bar{margin:2px 0 4px}
</style></head>

  if (ss && ss.date === today && ss.steps > 0) (day(today).steps = day(today).steps || {}).phone = ss.steps; // no reading yet = no data, not 0
  // Yesterday closed at midnight with its full count, even if the app was last opened in the evening.
  if (ss && ss.prevDate && ss.prevDate < today && ss.prevSteps > 0) { var ps = day(ss.prevDate).steps = day(ss.prevDate).steps || {}; if (!(ps.phone >= ss.prevSteps)) ps.phone = ss.prevSteps; }

function hideSplash() { var s = $('splash'); if (!s || s.classList.contains('out')) return; s.classList.add('out'); setTimeout(function () { s.remove(); }, 400); }
var obStep = 0;
function ob(i) {
  obStep = i; var p = D.profile, e = $('ob'); e.style.display = 'block'; e.scrollTop = 0;
  var dots = '<div class="dots">' + [0, 1, 2, 3, 4].map(function (k) { return '<i class="' + (k <= i ? 'on' : '') + '"></i>'; }).join('') + '</div>';
  var next = function (label) { return '<button class="pri" onclick="obNext()">' + (label || 'Next') + ' ' + ico('next', 14) + '</button>' + (i ? '<button onclick="obSave();ob(' + (i - 1) + ')">Back</button>' : ''); };
  var st = function (ok, yes, no) { return '<div class="' + (ok ? 'ok' : 'warn') + '">' + (ok ? yes : no) + '</div>'; };
  var nm = p.name === 'Hero' ? '' : p.name, h;
  if (i === 0) h = '<div style="display:flex;justify-content:center;margin-top:16px">' + body(2) + '</div><div class="say" style="margin-top:18px">' + (nm ? 'Hey ' + esc(nm) + '.' : 'Hey.') + ' This is you. You level up by doing the boring stuff: eating right, training, sleeping, staying off the phone.</div>' +
    '<div class="panel"><ol><li>Log meals, workouts, sleep, steps, habits and your mind.</li><li>Good days earn <b class="ok">XP</b>. Slips (scrolling, smoking, porn) never take XP away, they break your <b class="neg">clean streaks</b>.</li><li>ChatGPT does the calorie maths. No API, no account linking.</li><li>Everything stays on this phone. Text only, photos are never kept.</li></ol></div>' + '<div class="panel"><h3>Coming back?</h3><div class="muted">Restore everything from a backup instead of starting fresh.</div><div class="row"><button onclick="A.backupPickFolder()">Backup folder</button><button onclick="A.pickBackup()">Backup file</button></div></div>' + next('Start');
  if (i === 1) h = '<h1>ABOUT YOU</h1><div class="muted" style="margin:6px 0 12px">Used for your targets and health age. Stays on the phone.</div><div class="panel">' +
    '<label>Name<input id="o_name" value="' + esc(nm) + '" placeholder="Your name"></label>' +
    '<div class="g2"><label>Age<input id="o_age" inputmode="numeric" value="' + esc(p.age) + '"></label><label>Sex (for calories)<select id="o_sex"><option value="m"' + (p.sex !== 'f' ? ' selected' : '') + '>Male</option><option value="f"' + (p.sex === 'f' ? ' selected' : '') + '>Female</option></select></label>' +
    '<label>Height cm<input id="o_h" inputmode="decimal" value="' + esc(p.height || '') + '"></label><label>Weight kg<input id="o_w" inputmode="decimal" value="' + esc(p.weight) + '"></label></div></div>' + next();
  if (i === 2) {
    var sug = obSuggest(), g = G();
    h = '<h1>TARGETS</h1><div class="muted" style="margin:6px 0 12px">' + (sug ? 'Calories from Mifflin-St Jeor × 1.4 (light activity). Protein 1.6 g per kg. Fat 25% of calories. Change anything.' : 'Age, height or weight missing, so these are plain defaults. Change them.') + '</div><div class="panel g3">' +
      [['kcal', 'Calories'], ['protein', 'Protein g'], ['carbs', 'Carbs g'], ['fat', 'Fat g'], ['steps', 'Steps'], ['sleep', 'Sleep h'], ['screen', 'Phone min']].map(function (k) { return '<label>' + k[1] + '<input id="o_' + k[0] + '" inputmode="decimal" value="' + g[k[0]] + '"></label>'; }).join('') + '</div>' + next();
  }
  if (i === 3) h = '<h1>PERMISSIONS</h1><div class="muted" style="margin:6px 0 12px">All optional. Without one, you type that data in yourself.</div>' +
    '<div class="panel"><h3>' + ico('steps', 14) + ' Steps</h3>' + (A.hasStepSensor() ? (A.hasStepsPerm() ? st(1, 'Step tracking is on') : '<div class="muted">Lets the step sensor count your walking, even with the app closed.</div><button onclick="A.requestSteps()">Allow step tracking</button>') : st(0, '', 'This phone has no step sensor. Use manual steps.')) + '</div>' +
    '<div class="panel"><h3>' + ico('phone', 14) + ' Phone time</h3>' + (A.hasUsage() ? st(1, 'Usage access is on') : '<div class="muted">Android opens a list: find ALIVE?, turn it on, come back.</div><button onclick="A.openUsageSettings()">Open usage access</button>') + '</div>' +
    '<div class="panel"><h3>' + ico('send', 14) + ' ChatGPT app</h3>' + st(A.hasChatGPT(), 'ChatGPT is installed', 'ChatGPT isn\'t installed. Get it from the Play Store and log in, or pick another AI app when sharing.') + '</div>' +
    '<div class="panel"><h3>' + ico('bolt', 14) + ' Auto mode</h3>' + (A.hasAutoGPT() ? st(1, 'On. ALIVE? types into ChatGPT, sends, and brings the answer back.') :
      '<div class="muted">Lets ALIVE? type into the ChatGPT app, press Send and read the answer, so you never copy or paste. In the list tap <b>ALIVE? auto ChatGPT</b> and turn it on. If it is greyed out: Settings → Apps → ALIVE? → ⋮ → Allow restricted settings, then try again.</div><button onclick="A.openAutoGPTSettings()">Open accessibility settings</button>') + '</div>' + next();
  if (i === 4) h = '<h1>HOW IT WORKS</h1><div class="panel" style="margin-top:12px"><h3>Logging food or training</h3><ol><li>Log → Meal or Workout. Take a photo and/or type it.</li><li>Tap <b>Ask ChatGPT</b>. It opens with everything filled in. Press send.</li><li>Tap <b>Copy</b> under the answer.</li><li>Come back. It fills in by itself. Check it, save.</li></ol></div>' +
    '<div class="panel"><h3>A normal day</h3><ol><li>Morning: log sleep.</li><li>After eating: log the meal.</li><li>After training: log the workout.</li><li>Urge to scroll or smoke: tap Urge and wait it out (+3).</li><li>Night: save habits (clean day +8) and claim the sticky note (+8).</li></ol></div>' + '<div class="panel"><h3>Pick your modules</h3><div class="muted">Change them any time in Me.</div>' + modBoxes(1) + '</div><div class="muted" style="margin-bottom:10px">Make your own pixel avatar later in Me → Avatar studio.</div>' + next('Play');
  e.innerHTML = dots + h;
}
// Fills calorie/macro goals from body data unless you've edited goals yourself. Returns false if data missing.
function obSuggest() {
  var p = D.profile, a = L.n(p.age), w = L.n(p.weight), ht = L.n(p.height);
  if (!(a > 0 && w > 0 && ht > 0)) return false;
  if (!p.goalsEdited) {
    var g = G(), kcal = Math.round((10 * w + 6.25 * ht - 5 * a + (p.sex === 'f' ? -161 : 5)) * 1.4 / 50) * 50;
    g.kcal = kcal; g.protein = Math.round(w * 1.6); g.fat = Math.round(kcal * 0.25 / 9); g.carbs = Math.max(0, Math.round((kcal - g.protein * 4 - g.fat * 9) / 4)); save();
  }
  return true;
}
function obSave() {
  var p = D.profile, x = function (id) { return $(id) ? $(id).value.trim() : null; };
  if (obStep === 1 && $('o_age')) { p.name = x('o_name') || 'Hero'; p.age = x('o_age'); p.sex = x('o_sex'); p.height = x('o_h'); p.weight = x('o_w'); }
  if (obStep === 2 && $('o_kcal')) Object.keys(G()).forEach(function (k) { var v = L.n(x('o_' + k)); if (v > 0 && v !== G()[k]) { G()[k] = v; p.goalsEdited = true; } });
  save();
}
function obNext() {
  obSave();
  if (obStep < 4) return ob(obStep + 1);
  modRead(); D.onboarded = true; save(); navDraw(); $('ob').style.display = 'none'; go('home', 1); buzz([20, 40, 20]);
}

refreshSensors(); show();
(function () { var lv = L.level(totalXP()); $('splash').innerHTML = '<img src="logo.png" alt="ALIVE?" style="width:220px;height:220px">' + '<div class="muted px" style="margin-top:14px">' + (D.onboarded ? 'LV ' + lv.lv + ' · ' + lv.title : 'New game') + '</div><div class="blink">TAP TO START</div>'; })();setTimeout(hideSplash, 1800);
if (!D.onboarded) ob(0);
else (function () {
  var t; try { t = JSON.parse(localStorage.getItem(TMP)); } catch (e) {}
  if (!t || Date.now() - t.at > 3 * 3600e3) return dropTmp();
  draft = t.draft || {}; pend = t.pend; go(t.view);
  if (pend && !A.hasAutoGPT()) setTimeout(function () { fetchAI(pend, true); }, 1200);
})();
// The page may have reloaded while ChatGPT was answering: pick up a result the auto driver left behind.
setTimeout(function () { if ($('ob').style.display !== 'block') onAppResume(); }, 300);

setInterval(function () { if (document.visibilityState === 'visible') { refreshSensors(); if (stack[stack.length - 1] === 'home') R.home(); } }, 30000);
</script>
